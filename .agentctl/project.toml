schema = 1

[project]
id = "sinnix"
display_name = "Sinnix"
root_markers = ["flake.nix", "modules", "dots"]

[environment]
kind = "nix-develop"
command = ["nix", "develop", "--accept-flake-config", "--command"]
inherit = ["HOME", "USER", "LANG", "TERM", "SSH_AUTH_SOCK", "XDG_RUNTIME_DIR", "DBUS_SESSION_BUS_ADDRESS", "WAYLAND_DISPLAY", "DISPLAY"]
unset = ["PYTHONPATH", "PYTHONHOME", "VIRTUAL_ENV", "_PYTHON_SYSCONFIGDATA_NAME", "_PYTHON_HOST_PLATFORM", "PYTHONPYCACHEPREFIX"]

[workspace]
root = "/realm/worktree"
default_base = "origin/master"
verify = { candidate = "check" }
publish = "master"

[packets]
template = "dots/_ai/skills/orchestrate/references/worker-contract.md"
branch_prefix = "feature/packet"

[packets.defaults]
backend = "claude"
model = "claude-opus-5-5"
effort = "medium"

[packets.review]
backend = "claude"
model = "claude-opus-5-5"
effort = "medium"

# Codex quota is reserved (operator, 2026-09-29): batch workers, reviewers and
# every bead model_policy run on Claude Opus 5.5.
[packets.model_policy.provider-neutral-calibrated-v2]
backend = "claude"
model = "claude-opus-5-5"

[packets.model_policy.provider-neutral-capability-v1]
backend = "claude"
model = "claude-opus-5-5"

[packets.model_policy.provider-pinned-v1]
backend = "claude"
model = "claude-opus-5-5"

[operations.check]
description = "Run default Sinnix checks"
exec = ["check"]
pool = "bulk"
result = "exit"
cache = "tree+environment"
timeout_seconds = 7200
# Four evaluation workers, each replaced past 512 MiB, so the peak is about
# four times that threshold plus the largest single check (about 1 GiB); a
# measured run peaked at 3.6 GiB. Admission reserves that with margin so a
# check never lands on an exhausted host.
admission = { memory_mib = 4608 }

[operations.check_focused]
description = "Build explicitly selected Sinnix flake checks"
exec = ["nix", "build", "--no-link"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800

[operations.reverse_engineering_verify]
description = "Verify firmware extraction and Ghidra decompilation on synthetic inputs"
exec = ["nix", "develop", ".#reverse-engineering", "--command", "python3", "flake/tests/reverse-engineering.py"]
pool = "bulk"
result = "exit"
timeout_seconds = 900

[operations.firmware_analysis]
description = "Run an explicit REA firmware or native analysis command"
exec = ["nix", "run", ".#rea", "--"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800

[operations.ghidra_analysis]
description = "Run Ghidra headless with explicit project and loader arguments"
exec = ["nix", "develop", ".#reverse-engineering", "--command", "ghidra-analyzeHeadless"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800

[operations.pytest_focused]
description = "Run selected AgentCTL and gateway Python tests"
exec = ["nix", "develop", ".#gateway-tests", "--command", "gateway-pytest", "-q"]
pool = "normal"
result = "exit"
timeout_seconds = 1800

[operations.gateway_codegen]
description = "Render the generated gateway catalog and skill from their source"
exec = ["nix", "develop", ".#gateway-tests", "--command", "sinnix-agent-gateway-generate", "--root", ".", "--write"]
pool = "normal"
result = "exit"
timeout_seconds = 1800

[operations.verify_quick]
description = "Run maintained lint and formatting checks before lane publication"
exec = ["lint"]
pool = "normal"
result = "exit"

[operations.check_heavy]
description = "Run the heavy Sinnix check tier"
exec = ["check-heavy"]
pool = "bulk"
result = "exit"

[operations.check_all]
description = "Run all Sinnix semantic checks"
exec = ["check-all"]
pool = "bulk"
result = "exit"

[operations.check_master]
description = "Manually verify committed master's flake checks"
exec = ["check-master"]
pool = "bulk"
result = "exit"
timeout_seconds = 7200

[operations.lint]
description = "Run maintained Nix and shell linters"
exec = ["lint"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.switch]
description = "Build and activate the workstation configuration"
exec = ["switch"]
pool = "bulk"
result = "exit"
timeout_seconds = 28800

[operations.sinex_cache_prebuild]
description = "Build and cache the pinned Sinex revision after an input move"
exec = ["sinnix-sinex-cache-prebuild", "--flake-dir", "/realm/project/sinnix/repo", "--system", "x86_64-linux"]
pool = "bulk"
result = "exit"
timeout_seconds = 7200

[operations.census]
description = "Run the evidence-joined usage census"
exec = ["sinnix-census", "--window-days", "90"]
pool = "normal"
result = "exit"
schedule = "weekly"

[operations.transcribe]
description = "Transcribe selected audio files with the local speech engine"
exec = ["sinnix-stt", "transcribe"]
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 3600

[operations.transcribe_review]
description = "Transcribe selected recordings with Scribe v2 and retain word evidence"
exec = ["python3", "scripts/sinnix-stt-review"]
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 3600

[operations.diarize]
description = "Identify speaker turns in a selected audio file"
exec = ["sinnix-stt", "diarize"]
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 3600

[operations.elicit_autoingest]
description = "Ingest queued comparison judgments and refit changed models"
exec = ["sinnix-elicit", "autoingest"]
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 300

[operations.phone_app_build]
description = "Build the phone application and its signing installer"
exec = ["nix", "build", ".#sinnix-phone-app-install", "--no-link", "--print-out-paths"]
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 3600

[operations.phone_dispatcher_build]
description = "Build and test the phone upload and repair tools"
exec = ["nix", "build", ".#checks.x86_64-linux.sinnix-phone-dispatcher-suite", "--no-link", "--print-out-paths"]
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 1800

[operations.agent_environment_doc]
description = "Render the declared agent environment reference"
exec = ["nix", "run", ".#sinnix-agent-environment-doc", "--", "--output", "docs/agent-environment.md"]
pool = "normal"
result = "exit"
timeout_seconds = 1800

[operations.build_system]
description = "Build the declared workstation configuration without activation"
exec = ["env", "SINNIX_SECRET_DECLARATIONS=/realm/state/secrets/sinnix/runtime.nix", "nix", "build", "--impure", "--no-link", ".#nixosConfigurations.sinnix-prime.config.system.build.toplevel"]
pool = "bulk"
result = "exit"
timeout_seconds = 14400

[operations.navigation_audit]
description = "Audit current entrance links against the private explicit manifest"
exec = ["sinnix-navigation-audit", "--manifest", "/realm/report/catalog/navigation-audit.json"]
pool = "normal"
result = "exit"
cache = "none"

[operations.fs_index_restore]
description = "Restore a coherent filesystem-index generation from explicit dated scan artifacts"
exec = ["env", "PYTHONPATH=pkgs/sinnix-lib", "python3", "scripts/sinnix-fs", "ledger", "--index-dir", "/realm/state/fs-index", "--retained-inputs"]
arguments = "required"
pool = "bulk"
result = "exit"
cache = "none"
scratch = "nvme"
timeout_seconds = 7200

[operations.fs_index_scan]
description = "Scan managed filesystems and publish one coherent index generation"
exec = ["env", "PYTHONPATH=pkgs/sinnix-lib", "python3", "scripts/sinnix-fs", "run", "--out-dir", "/realm/state/fs-index"]
pool = "bulk"
result = "exit"
cache = "none"
scratch = "nvme"
timeout_seconds = 21600

[operations.git_store_repair]
description = "Preserve refs and package borrowed reachable Git objects independently"
exec = ["python3", "scripts/sinnix-git-store-repair"]
arguments = "required"
pool = "normal"
result = "exit"
cache = "none"
scratch = "nvme"
timeout_seconds = 1800

[operations.verify_report_navigation]
description = "Verify report-index links in local and served contexts"
exec = ["nix", "build", "--no-link", ".#checks.x86_64-linux.report-navigation-suite"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.clean_terminal_worktrees]
description = "Release terminal managed worktrees through their lifecycle owner, retaining evidence and uncertain work"
exec = ["agentctl", "batch", "clean", "--json", "--project"]
arguments = "required"
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 3600
