schema = 1

[project]
id = "sinnix"
display_name = "Sinnix"
root_markers = ["flake.nix", "modules", "dots"]

[environment]
kind = "nix-develop"
command = ["nix", "develop", "--accept-flake-config", "--command"]
preflight = ["true"]
preflight_timeout_seconds = 180
inherit = ["HOME", "USER", "LANG", "TERM", "SSH_AUTH_SOCK", "XDG_RUNTIME_DIR", "DBUS_SESSION_BUS_ADDRESS", "WAYLAND_DISPLAY", "DISPLAY"]
unset = ["PYTHONPATH", "PYTHONHOME", "VIRTUAL_ENV", "_PYTHON_SYSCONFIGDATA_NAME", "_PYTHON_HOST_PLATFORM", "PYTHONPYCACHEPREFIX"]

[workspace]
provider = "git-worktree"
root = "/realm/worktrees"
default_base = "origin/master"
identity_check = ["git", "diff", "--quiet", "--", "flake.nix"]
checkpoint_untracked = true
verification_operations = ["check", "lint"]

[packets]
template = "dots/_ai/skills/orchestrate/references/worker-contract.md"
atlas_dir = "docs/atlas"
branch_prefix = "feature/packet"

[packets.defaults]
backend = "codex"
model = "gpt-5.6-luna"
effort = "medium"

[operations.check]
description = "Run default Sinnix checks"
exec = ["check"]
pool = "bulk"
result = "exit"

[operations.check_master]
# Master-boundary watch: sinnix has no CI, so between landings nothing tests
# master and one red masks the next (three stacked reds cost hours of lane
# checks on 2026-08-31). Builds from the committed ref so operator WIP in
# the working tree can neither redden nor mask it; an unchanged master is a
# nix cache hit.
description = "Verify committed master's flake checks on a standing schedule"
exec = ["bash", "-c", "set -euo pipefail; ref='git+file:///realm/project/sinnix?ref=master'; for t in $(nix eval \"$ref#checks.x86_64-linux\" --apply builtins.attrNames --json --accept-flake-config | jq -r '.[]'); do nix build \"$ref#checks.x86_64-linux.$t\" --no-link --accept-flake-config; done"]
pool = "bulk"
result = "exit"
# One hourly check at a time: a later firing subsumes an earlier queued one.
timeout_seconds = 7200
schedule = "hourly"

[operations.lint]
description = "Run maintained Nix and shell linters"
exec = ["lint"]
pool = "normal"
result = "exit"

[operations.switch]
description = "Build and activate the workstation configuration"
exec = ["switch"]
pool = "bulk"
result = "exit"

[operations.sinex_cache_prebuild]
description = "Build and cache the pinned Sinex revision after an input move"
exec = ["sinnix-sinex-cache-prebuild", "--flake-dir", "/realm/project/sinnix", "--system", "x86_64-linux"]
pool = "bulk"
result = "exit"
timeout_seconds = 7200

[operations.census]
description = "Run the evidence-joined usage census"
exec = ["sinnix-census", "--window-days", "90"]
pool = "normal"
result = "exit"
schedule = "weekly"

[conflicts]
exact_files = ["flake.lock", "flake.nix"]
generated_surfaces = ["docs/agent-environment.md", "docs/config-default-audit-features.md"]

[conflicts.semantic_slots]
nixos-generation = ["flake.nix", "flake.lock", "flake/nixos.nix"]
ports-registry = ["flake/data/ports.nix"]
project-registry = [".agentctl/project.toml", "modules/services/sinnixd.nix"]
service-registry = ["modules/services/*.nix"]
