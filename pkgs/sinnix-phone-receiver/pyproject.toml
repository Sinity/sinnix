[project]
name = "sinnix-phone-receiver"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
sinnix-phone-receiver = "sinnix_phone_receiver.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sinnix_phone_receiver*"]
