org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# The build runs inside a Nix derivation and under the mitm-cache update
# sandbox; neither wants a background daemon surviving the phase, and the
# Kotlin daemon in particular fails to spawn when $HOME is a scratch dir.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# No analytics, no version checks, no SDK downloads: the SDK comes from Nix and
# the network is either absent (build) or recorded (update).
android.builder.sdkDownload=false
