[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sinnix-fs"
version = "0.1.0"
description = "Filesystem inventory, classifications, inspected assets and maintenance"
requires-python = ">=3.12"

[project.scripts]
sinnix-fs = "sinnix_fs.cli:main"

[tool.setuptools.packages.find]
include = ["sinnix_fs*"]
