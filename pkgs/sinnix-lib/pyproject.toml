[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sinnix-lib"
version = "0.1.0"
description = "Shared sinnix library: atomic state, ledgers, locks, notify, systemd probes, spools"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["sinnix_lib*"]
