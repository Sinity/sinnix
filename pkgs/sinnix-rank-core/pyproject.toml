[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sinnix-rank-core"
version = "0.1.0"
description = "Shared pairwise/choice-set preference ranking engine: Plackett-Luce fit, stopping statistic, selection, draw policies"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["rank_core*"]
