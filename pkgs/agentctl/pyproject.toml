[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentctl"
version = "0.1.0"
description = "agentctl: native project jobs and retained history"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agentctl = "agentctl.cli:main"
agentctl-run = "agentctl.run:main"
agentctl-devenv = "agentctl.devenv:main"

[tool.setuptools.packages.find]
include = ["agentctl*"]
