[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sinnixd"
version = "0.1.0"
description = "Sinnix local runtime daemon and agentctl client"
requires-python = ">=3.12"
dependencies = ["sinnix-mcp==0.1.0", "sinnix-lib==0.1.0"]

[project.scripts]
agentctl = "sinnixd.cli:main"
sinnixd = "sinnixd.cli:daemon_main"
sinnixd-contract-runner = "sinnixd.runner:main"
sinnixd-queue-run = "sinnixd.queue_run:main"
sinnixd-delivery-runner = "sinnixd.delivery_runner:cli"
sinnixd-harvest = "sinnixd.harvest:harvest_cli"
sinnixd-publication-sweep = "sinnixd.publication_sweep:main"
sinnix-retrospective = "sinnixd.retrospective:main"
sinnixd-project-environment-check = "sinnixd.projects:project_environment_check_main"

[tool.setuptools.packages.find]
include = ["sinnixd*"]
