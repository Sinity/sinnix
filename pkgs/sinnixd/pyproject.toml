[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sinnixd"
version = "0.1.0"
description = "agentctl: jobs over pueue, lanes over worktrunk, gh and bd"
requires-python = ">=3.12"

[project.scripts]
agentctl = "sinnixd.cli:main"
sinnixd-queue-run = "sinnixd.queue_run:main"
sinnixd-backpressure = "sinnixd.backpressure:main"

[tool.setuptools.packages.find]
include = ["sinnixd*"]
