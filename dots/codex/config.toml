# Canonical Codex home on this system is ~/.codex.
# Global instruction file is ~/.codex/AGENTS.md.
# Skills are managed from ~/.codex/skills via Home Manager.
# MCP servers are registry-generated into full/lean/browser profile files by
# modules/features/dev/mcp-servers.nix. The wrapper invokes the intended
# profile explicitly so lean sessions do not inherit the full MCP table.
model = "gpt-5.6-luna"
model_reasoning_effort = "high"
model_catalog_json = "/home/sinity/.codex/models-v1.json"
approval_policy = "never"
sandbox_mode = "danger-full-access"
project_doc_max_bytes = 262144
project_doc_fallback_filenames = ["CLAUDE.md"]
plan_mode_reasoning_effort = "xhigh"

[projects."/home/sinity"]
trust_level = "trusted"

[projects."/home/sinity/.gemini/tmp/polylogue"]
trust_level = "trusted"

[projects."/realm/project"]
trust_level = "trusted"

# Codex scopes trust per git-repo root, so the /realm/project parent above does
# not cover its sub-repos — declare each one we work in (config is read-only at
# runtime: it is generated by mcp-servers.nix merging this file with MCP entries,
# so trust must be declared here rather than written by Codex at runtime).
[projects."/realm/project/sinex"]
trust_level = "trusted"

[projects."/realm/project/sinnix"]
trust_level = "trusted"

[projects."/realm/project/sinity-lynchpin"]
trust_level = "trusted"

[projects."/realm/project/polylogue"]
trust_level = "trusted"

[projects."/realm/project/scribe-tap"]
trust_level = "trusted"

[projects."/realm/project/intercept-bounce"]
trust_level = "trusted"

[projects."/realm/project/knowledge-extract"]
trust_level = "trusted"

[projects."/realm/project/pwrank"]
trust_level = "trusted"

[projects."/realm/data/knowledgebase"]
trust_level = "trusted"

[projects."/realm/data/libraries/substack"]
trust_level = "trusted"

[projects."/realm/data/comms/irc"]
trust_level = "trusted"

[projects."/neo-outer-realm/content/media"]
trust_level = "trusted"

[notice.model_migrations]
gpt-5-codex = "gpt-5.3-codex"

[tui]
status_line = ["current-dir", "model-with-reasoning", "context-remaining", "context-window-size", "five-hour-limit", "weekly-limit", "session-id"]

[tui.model_availability_nux]
"gpt-5.6-luna" = 4
"gpt-5.6-terra" = 4

[features]
hooks = true
multi_agent = true
multi_agent_v2 = false
prevent_idle_sleep = true
apps = true

# Multi-agent fanout ceiling. The base session (model/effort/sandbox/
# approval above) already applies to every invocation via the `codex` wrapper
# (--profile full); subagents inherit those same permissive settings unless a
# custom agent file overrides them, so no separate writable_roots/sandbox
# carve-out is needed here. default_subagent_model keeps ACCIDENTAL
# inheritance/delegation cheap (a stray fanout becomes a Luna, not another
# Sol) — deliberate delegation to a specific tier still goes through an
# explicit custom-agent file (see project .codex/agents/).
[agents]
enabled = true
interrupt_message = true
max_concurrent_threads_per_session = 24
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

[agents.explorer]
description = "Fast read-only codebase exploration and evidence gathering."
config_file = "agents/explorer.toml"

[plugins."google-calendar@openai-curated"]
enabled = false

[plugins."gmail@openai-curated"]
enabled = false

[plugins."canva@openai-curated"]
enabled = false

[plugins."github@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = false
