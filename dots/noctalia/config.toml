# Noctalia shell configuration: the declared layer.
#
# Symlinked out-of-store into ~/.config/noctalia/config.toml, so edits apply
# on the next reload with no rebuild. Noctalia merges it with the GUI-owned
# ~/.local/state/noctalia/settings.toml, and the state file wins. Stable
# intent lives here; wallpaper favorites, last wallpaper, lockscreen widget
# geometry and other genuinely mutable state stay in the state file. The
# config-drift lane compares this file with `noctalia config export merged`
# for the critical keys, so a GUI override of one is reported, not silent.

[accessibility]
ui_scale = 1.5

[shell]
font_family = "SauceCodePro Nerd Font"
time_format = "{:%T}"
polkit_agent = true
clipboard_enabled = true
clipboard_history_max_entries = 2000

[shell.animation]
speed = 1.5

[shell.panel]
transparency_mode = "glass"

[shell.screenshot]
save_to_file = true
copy_to_clipboard = true
directory = "/realm/activity/screenshot"
filename_pattern = "%Y-%m-%d-At-%Hh%Mm%Ss"
freeze_screen = false
confirm_region = false

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

[theme.templates]
enable_builtin_templates = true
# hyprland: the native template writes the wallpaper palette to
# ~/.config/hypr/noctalia.lua and hyprland.lua applies it.
# kitty is a user template below: the builtin's apply hook edits kitty.conf,
# which Home Manager owns; the managed kitty.conf already includes the theme.
builtin_ids = ["gtk3", "gtk4", "hyprland", "qt"]
enable_community_templates = true
community_ids = ["zed", "yazi"]

[theme.templates.user.kitty]
enabled = true
input_path = "templates/kitty.conf"
output_path = "$XDG_CONFIG_HOME/kitty/themes/noctalia.conf"
post_hook = "pkill -USR1 kitty >/dev/null 2>&1 || true"

[wallpaper]
enabled = true
directory = "/home/sinity/wallpaper"
# ~/wallpaper/{dark,light} are symlinks retargeted by the time-of-day timer
# (modules/features/desktop/wallpaper.nix), so these paths are stable.
directory_dark = "/home/sinity/wallpaper/dark"
directory_light = "/home/sinity/wallpaper/light"
per_monitor_directories = false
transition_on_startup = true

[wallpaper.automation]
enabled = true
# Every change rewrites settings.toml (wallpaper.last) and triggers a full
# config reload, so the interval is also the reload cadence.
interval_seconds = 120
order = "random"
recursive = true

[location]
auto_locate = true

[weather]
refresh_minutes = 5

# Bars are [bar.<name>] tables; "default" is the only bar. The panel is a
# 48-inch 3840x2160 at compositor scale 1, hence the bar scale.
[bar.default]
position = "bottom"
thickness = 56
scale = 2.0
padding = 15
margin_edge = 5
margin_ends = 75
radius = 10
font_weight = 300
widget_spacing = 15
start = ["session", "wallpaper", "control-center", "volume", "audio_visualizer", "media", "launcher"]
center = ["tray", "notifications", "clock", "workspaces"]
end = [
  "sinity/sinnix-cockpit:capture-strip",
  "sinity/sinnix-cockpit:capabilities",
  "sinity/sinnix-cockpit:reading-stack",
  "sinity/sinnix-ops:capsule",
  "sysmon",
]

[widget.brightness]
scale = 1.15

[widget.launcher]
scale = 0.95

[widget.sysmon]
highlight_color = "on_error"
stat = "ram_used"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "session"

[notification]
enable_daemon = true
blacklist = []
blacklist_allow_critical = true
collapse_on_dismiss = true
# The toast surface spans the output height; the package patch keeps it from
# requesting the compositor background effect, which Hyprland would apply to
# the whole surface. "top" keeps toasts above windows without overlay
# authority.
layer = "top"
monitors = []
position = "top-right"
scale = 1.0
show_actions = true
show_app_name = true
background_opacity = 0.96

# Notes are plain Markdown in the notes folder; the plugin is a view over them.
[plugin_settings."noctalia/notes"]
notes_dir = "/realm/notes"
extension = "md"
