# Noctalia shell configuration.
#
# Writable + live-editable: this file is symlinked out-of-store into
# ~/.config/noctalia/config.toml (see modules/features/desktop/noctalia.nix),
# so edits here apply on the next reload with no rebuild.
#
# It is the BASE layer, not the only one. Noctalia merges this with
# ~/.local/state/noctalia/settings.toml, and the state file WINS. That is where
# the Settings GUI persists — despite this file being writable, the GUI does
# not write back to it. So a value set in the GUI silently overrides whatever
# is written here, and the two can disagree indefinitely without any symptom:
# the bar sat at position="top" in this file while running at the bottom for
# however long, because the state layer said bottom (noticed 2026-08-14).
#
# Practical rule: treat this file as the declared intent and check
# `noctalia config export merged` for what is actually in force. When they
# disagree and this file is the one that is wrong, fix it here rather than
# leaving the repo describing a desktop that does not exist.

[shell.screenshot]
save_to_file = true
copy_to_clipboard = true
directory = "/realm/data/captures/screenshot"
filename_pattern = "%Y-%m-%d-At-%Hh%Mm%Ss"
freeze_screen = false
confirm_region = false

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

[theme.templates]
enable_builtin_templates = true
# hyprland is in this list because it was missing, and its absence made
# ~/.config/hypr/noctalia.conf a dead file: hyprland/default.nix sources that
# path for wallpaper-derived colours, and nothing ever generated it, so it
# still held only its seed comment. Noctalia's builtin hyprland template is
# also config-provider aware (it detects hyprland.lua vs hyprland.conf and
# writes the matching include), so it is the one piece of this desktop already
# ready for the Lua migration.
builtin_ids = ["gtk3", "gtk4", "hyprland", "kitty", "qt"]
enable_community_templates = true
community_ids = ["zed", "yazi"]

[wallpaper]
enabled = true
directory = "/home/sinity/wallpaper"
# directory_dark/directory_light are real v5 keys (accepted by the installed
# binary's own `noctalia config validate`). They point at STABLE paths --
# ~/wallpaper/{dark,light} are
# symlinks retargeted by the time-of-day timer in
# modules/features/desktop/wallpaper.nix, so this file never needs to
# change when the active time-of-day set rotates.
directory_dark = "/home/sinity/wallpaper/dark"
directory_light = "/home/sinity/wallpaper/light"
per_monitor_directories = false

[wallpaper.automation]
enabled = true
interval_seconds = 120
order = "random"
recursive = true

# Bars are defined as [bar.<name>] tables (the default bar is "default").
# thickness is the bar height in px; Noctalia's default is 34, which is tiny on
# the 48" 4K panel at scale 1. Raise it here or in Settings -> Bar (which
# persists to the state layer described at the top of this file, not here).
[bar.default]
# Bottom, matching both the operator's intent and what has actually been
# running; this file said "top" and was simply overridden and never noticed.
position = "bottom"
thickness = 56

[notification]
enable_daemon = true
blacklist = []
blacklist_allow_critical = true
collapse_on_dismiss = true
layer = "overlay"
monitors = []
position = "top-right"
scale = 1.0
show_actions = true
show_app_name = true
background_opacity = 0.96
