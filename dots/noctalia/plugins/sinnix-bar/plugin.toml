id = "sinity/sinnix-bar"
name = "Sinnix Bar"
version = "0.1.0"
plugin_api = 9
author = "Sinity"
license = "MIT"
dependencies = ["hyprctl"]
tags = ["bar", "system", "utility", "hyprland"]
icon = "layout-dashboard"
description = "Visible bar affordances for capture, the capability index and the reading stack."

[[service]]
id = "probe"
entry = "service.luau"

[[setting]]
key = "index_path"
type = "file"
label_key = "settings.index_path.label"
description_key = "settings.index_path.description"
default = "/etc/sinnix/capability-index.json"

[[widget]]
id = "capture-strip"
entry = "capture-strip.luau"

[[widget]]
id = "capabilities"
entry = "capabilities.luau"

[[widget]]
id = "reading-stack"
entry = "reading-stack.luau"
