id = "sinity/sinnix-cockpit"
name = "Sinnix Cockpit"
version = "0.1.0"
plugin_api = 9
author = "Sinity"
license = "MIT"
dependencies = ["hyprctl"]
tags = ["bar", "system", "utility", "hyprland"]
icon = "space_dashboard"
description = "Visible bar affordances for the drilled capture verbs and the capability index."

[[service]]
id = "probe"
entry = "service.luau"

[[setting]]
key = "hub_url"
type = "string"
label_key = "settings.hub_url.label"
description_key = "settings.hub_url.description"
default = "http://127.0.0.1:8880"

[[setting]]
key = "index_path"
type = "file"
label_key = "settings.index_path.label"
description_key = "settings.index_path.description"
default = "/etc/sinnix/capability-index.json"

[[widget]]
id = "capture-strip"
entry = "capture-strip.luau"

[[widget]]
id = "capabilities"
entry = "capabilities.luau"
