# Curated Noctalia v5 plugin sources and enabled entries.
# Source locations are stable home paths backed by immutable Nix sources.
[plugins]
auto_update = "none"
enabled = ["noctalia/timer", "sinity/sinnix-ops", "sinity/sinnix-bar"]

[[plugins.source]]
name = "official"
kind = "path"
location = "~/.local/share/noctalia/pinned/official"

[[plugins.source]]
name = "sinity"
kind = "path"
location = "~/.local/share/noctalia/local"
