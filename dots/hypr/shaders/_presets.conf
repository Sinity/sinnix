# Named compositions. `name = stage stage ...`, applied left to right:
# warps hit the sampling coordinate first, then shades hit the colour.
# Order matters — `posterize filmgrain` grains a flat image, `filmgrain
# posterize` quantises the grain away.

television    = crt scanlines chromatic vignette
tape          = vhs crt vignette
arcade        = pixelate posterize scanlines
handheld      = pixelate gameboy vignette
newsprint     = grayscale dither vignette
oscilloscope  = edges scanlines
blueprint     = edges vignette
graphite      = sketch vignette
darkroom      = sepia filmgrain vignette
lomo          = chromatic filmgrain vignette
predator      = thermal scanlines
patrol        = nightvision filmgrain
broken        = glitch chromatic scanlines
dreaming      = wobble bloom huecycle
lava          = plasma posterize
searchlight   = spotlight filmgrain vignette
funhouse      = fisheye chromatic
mandala       = kaleido huecycle bloom
sunset        = warmth bloom vignette
xerox         = grayscale posterize scanbeam
